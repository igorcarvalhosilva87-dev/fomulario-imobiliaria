<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes - Google Sheets</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: 0 auto; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        /* Adicionei o textarea aqui no CSS para manter o mesmo visual dos outros campos */
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: Arial, sans-serif; }
        textarea { resize: vertical; }
        button { width: 100%; padding: 10px; background-color: #0F9D58; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0B7542; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cadastro de Cliente</h2>

    <form id="formCliente">
        <div class="form-group">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" required placeholder="Ex: João Silva">
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" required placeholder="joao@email.com">
        </div>

        <div class="form-group">
            <label for="telefone">Telefone / WhatsApp:</label>
            <input type="tel" id="telefone" required placeholder="(11) 99999-9999">
        </div>

        <div class="form-group">
            <label for="perfil">Perfil do Cliente / Interesse:</label>
            <select id="perfil" required>
                <option value="">Selecione...</option>
                <option value="Compra">Compra</option>
                <option value="Aluguel">Aluguel</option>
                <option value="Investimento">Investimento</option>
                <option value="Venda">Venda</option>
            </select>
        </div>

        <!-- NOVA CAIXA DE DIÁLOGO ADICIONADA AQUI -->
        <div class="form-group">
            <label for="detalhesImovel">Descreva o imóvel e o endereço:</label>
            <textarea id="detalhesImovel" rows="4" required placeholder="Sobrado 4 quartos na Asa Sul..."></textarea>
        </div>

        <button type="submit" id="btnSalvar">Cadastrar</button>
    </form>
</div>

<script>
    // Cole aqui a URL longa que você copiou do Google Apps Script
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycby47WzBP_CBmQjiAQRhfVyJT0O8cHbjSGLaA5tl46zG0NFKAxOKGjYvFH4cvAkKVMrH/exec";

    document.getElementById('formCliente').addEventListener('submit', function(event) {
        event.preventDefault();

        const btn = document.getElementById('btnSalvar');
        btn.innerText = "Salvando...";
        btn.disabled = true;

        // Monta o objeto com os dados digitados
        const cliente = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            telefone: document.getElementById('telefone').value,
            perfil: document.getElementById('perfil').value,
            tipoImovel: document.getElementById('detalhesImovel').value,
            dataCadastro: new Date().toLocaleDateString('pt-BR')
        };

        // Envia os dados para a planilha usando a API do Google
        fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            mode: 'no-cors', // Evita problemas de segurança entre domínios (CORS)
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(cliente)
        })
        .then(() => {
            alert('Cliente salvo diretamente no Google Sheets!');
            this.reset(); // Limpa o formulário
        })
        .catch(error => {
            alert('Erro ao salvar os dados.');
            console.error(error);
        })
        .finally(() => {
            btn.innerText = "Salvar na Planilha";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
